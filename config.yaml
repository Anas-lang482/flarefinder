# FlareFinder — central configuration
# RULE 7: no magic numbers in code. Every threshold, bound, year and seed
# lives here. If a number appears in src/, it is a bug.
#
# Provenance tags used below:
#   [LIT]         value taken from published literature (citation given)
#   [CALIBRATE]   PLACEHOLDER. Not yet justified. Must be set empirically on
#                 the training split before any result using it is reported.
#   [CHOICE]      our design decision, defensible but arbitrary

project:
  name: flarefinder
  version: 0.1.0
  description: >
    Detection of small onshore gas flares in the Gulf via VIIRS + Sentinel-2
    SWIR fusion, with a physics-constrained learned volume model.

# ---------------------------------------------------------------------------
# REPRODUCIBILITY (RULE 7)
# ---------------------------------------------------------------------------
seeds:
  global: 42          # numpy / random / python hash seed
  split: 1337         # train/test partitioning ONLY — never reuse elsewhere
  model: 7            # model init, subsampling, tree construction
  bootstrap: 2718     # resampling for confidence intervals

# ---------------------------------------------------------------------------
# STUDY REGION
# Region is a LIST, not hardcoded values, so the stretch goal (wider Middle
# East, offshore) costs a config edit rather than a refactor.
# tier: core     -> in scope now, part of the headline claim
# tier: stretch  -> only after core work is validated; report separately
# bbox: [lon_min, lat_min, lon_max, lat_max] in EPSG:4326. These are
#       approximate national envelopes for candidate-site filtering,
#       NOT political borders.
# ---------------------------------------------------------------------------
regions:
  - code: SAU
    name: Saudi Arabia
    tier: core
    bbox: [34.5, 16.0, 55.7, 32.2]
    # !! The EOG code for Saudi Arabia is NOT STABLE ACROSS YEARS. Verified
    # against all nine workbooks on 2026-08-31:
    #   2012-2023 -> SAU        (standard ISO3)
    #   2024      -> SAUCROP    (changed, reason unknown)
    #   all years -> SAUKWTNZ   (Saudi-Kuwait Neutral Zone, separate entity)
    # Listing only the 2024 code silently drops twelve years of Saudi data;
    # listing only "SAU" silently drops 2024. Both failures are quiet, and
    # both would corrupt the held-out test region. All three are required.
    # Any future year must be re-checked, not assumed.
    eog_iso_codes: [SAU, SAUCROP, SAUKWTNZ]
  - code: IRQ
    name: Iraq
    tier: core
    bbox: [38.8, 29.0, 48.6, 37.4]
    eog_iso_codes: [IRQ]
  - code: IRN
    name: Iran
    tier: core
    bbox: [44.0, 25.0, 63.4, 39.8]
    eog_iso_codes: [IRN]
  - code: KWT
    name: Kuwait
    tier: stretch
    bbox: [46.5, 28.5, 48.5, 30.1]
  - code: ARE
    name: United Arab Emirates
    tier: stretch
    bbox: [51.5, 22.6, 56.4, 26.1]
  - code: QAT
    name: Qatar
    tier: stretch
    bbox: [50.7, 24.4, 51.7, 26.2]
  - code: OMN
    name: Oman
    tier: stretch
    bbox: [52.0, 16.6, 59.9, 26.4]
  - code: BHR
    name: Bahrain
    tier: stretch
    bbox: [50.4, 25.8, 50.8, 26.3]

active_tiers: [core]     # switch to [core, stretch] only when core is done

# Onshore / offshore handling.
# NOTE: offshore is the EASY case. Water is cold and dark in SWIR, so the
# desert false-positive problem largely vanishes there. Never pool offshore
# and onshore into one headline metric — it flatters the result.
site_domain:
  include_onshore: true
  include_offshore: false        # stretch goal only
  report_separately: true        # non-negotiable if offshore is enabled

# ---------------------------------------------------------------------------
# TIME RANGE
# ---------------------------------------------------------------------------
years:
  # EOG / VIIRS annual flare catalogue: VIIRS operational from 2012.
  # VERIFY on download: the 2025 annual file may not be published yet.
  # If it is missing, drop eog_end to 2024 rather than silently half-filling
  # the last year -- a partial year would bias every size-binned metric.
  # VERIFIED 2026-08-31: EOG publishes through 2024 only. The 2025 annual
  # file does not exist yet, so the fusion range stops at 2024.
  eog_start: 2012
  eog_end: 2024
  # Sentinel-2 L2A: S2A 2015, S2B 2017, global L2A coverage from Dec 2018.
  # We start at 2019 so every fusion year has both sensors. [CHOICE]
  s2_start: 2019
  s2_end: 2024
  # Years where BOTH sensors exist -> the fusion dataset.
  fusion_start: 2019
  fusion_end: 2024

# ---------------------------------------------------------------------------
# DATA SOURCES
# ---------------------------------------------------------------------------
data:
  raw_dir: data/raw
  processed_dir: data/processed

  eog:
    # Annual per-site flared volume spreadsheets, eogdata.mines.edu
    # CAVEAT (state in every analysis): EOG volumes are themselves derived
    # from VIIRS — the sensor whose blind spots we target. EOG is a volume
    # reference for sites it contains; it is NOT independent evidence for
    # sites it omits.
    source_url: https://eogdata.mines.edu
    raw_subdir: eog

  viirs:
    # DISPROVEN 2026-08-31: s3://blackmarble-combustion does not exist
    # (anonymous boto3 list -> NoSuchBucket, plus 7 variants). Nulled rather
    # than deleted so nobody re-adds it from the same bad source.
    s3_bucket: null
    s3_anonymous: true            # --no-sign-request, if a bucket is found
    raw_subdir: viirs
    # RESOLVED 2026-09-01: EOG VNF. Verified that every path under
    # /wwwdata/viirs_products/vnf/ returns 302 to eogauth.mines.edu, so this
    # source needs a bearer token -- unlike the annual workbooks, which are
    # public direct links.
    access_method: eog_vnf
    vnf_base_url: https://eogdata.mines.edu/wwwdata/viirs_products/vnf
    vnf_version: v30              # [CALIBRATE] v40/v35/v30/v21 all exist.
                                  # Confirm against one REAL file before a
                                  # bulk run -- do not guess the layout.
    token_env: EOG_ACCESS_TOKEN   # read from .env, which is gitignored.
                                  # The password never enters this repo.
    # Start small. One night proves the URL pattern and the token; only then
    # widen the range. A wrong pattern over 2,000 nights wastes a day.
    probe_date: 2024-01-15
    start_date: 2024-01-01
    end_date: 2024-12-31

  earthengine:
    # Earth Engine now requires a Cloud project id on Initialize().
    # Registered noncommercial, Community tier (150 EECU-hour limit, no
    # billing account). The quota is the reason src/data_s2.py must cache
    # every extraction to data/processed and never re-pull an existing file:
    # debugging against GEE instead of against the cached table is what
    # burns the budget.
    project: flarefinder-478291

  sentinel2:
    gee_collection: COPERNICUS/S2_SR_HARMONIZED
    # SWIR is where flames glow. B8A kept as a non-SWIR control band.
    bands: [B8A, B11, B12]
    band_wavelengths_nm: {B8A: 865, B11: 1610, B12: 2190}
    native_resolution_m: 20
    sanity_b12_b8a_min: 1.2       # [CHOICE] SWIR excess that counts as a
                                  # thermal signature in the premise check
    buffer_m: 100                 # [CHOICE] radius sampled around each
                                  # point. Wider dilutes a sub-pixel
                                  # flare; narrower risks missing it if
                                  # the coordinate is a little off.
    max_cloud_pct: 60             # [CHOICE] permissive: flares are point-like
                                  # and survive partial cloud. Tighten if the
                                  # false-positive rate demands it.

  sentinel5p:
    # Extension only. Not part of the core claim.
    gee_collection: COPERNICUS/S5P/OFFL/L3_CH4
    enabled: false

# ---------------------------------------------------------------------------
# DETECTION THRESHOLDS
# WARNING: the [CALIBRATE] values below are PLACEHOLDERS chosen to make the
# pipeline runnable. They are not from literature and carry no authority.
# Fit them on the TRAINING SPLIT ONLY, then record the fitted values here
# with a provenance note. Reporting any result that depends on an
# uncalibrated placeholder is a rule violation.
# ---------------------------------------------------------------------------
thresholds:
  viirs:
    # Seymour et al. 2025 (Environ. Sci. Technol.): VIIRS misses flares
    # below roughly this rate. This is the failure we target. [LIT]
    detection_limit_m3_per_h: 360
    min_detections_per_year: 1    # [CHOICE] a site counts as being "in the
                                  # official record" if VIIRS saw it at
                                  # least this many times

  sentinel2:
    swir_radiance_min: null       # [CALIBRATE] B12 threshold for a hot pixel
    b12_b11_ratio_min: null       # [CALIBRATE] flames are relatively hotter
                                  # at 2190nm than 1610nm; bare desert is not
    min_hot_pixels: 1             # [CHOICE] 20 m pixels, and small flares are
                                  # genuinely sub-pixel

  # THE CORE IDEA. Flares flicker across passes. Sun-heated desert follows
  # the sun and is persistent and seasonal. These separate the two.
  intermittency:
    min_passes_per_site: 8        # [CHOICE] below this the temporal
                                  # statistics are too noisy to trust
    detection_rate_min: null      # [CALIBRATE] fraction of passes that are hot
    detection_rate_max: null      # [CALIBRATE] ALWAYS hot => probably ground,
                                  # not a flare
    require_night_day_disagreement: true   # a real flare burns at night too;
                                           # sun-heated ground does not

  site_matching:
    # Radius for joining a detection to an EOG catalogue site.
    match_radius_m: 500           # [CHOICE] ~25 Sentinel-2 pixels. Sensitive
                                  # parameter — run a sensitivity sweep on it.
    # Radius for reconciling the SAME physical flare across years. EOG
    # re-issues site ids annually and the coordinates jitter, because they
    # come from clustered detections rather than surveyed positions.
    # Complete-linkage clustering, so no cluster exceeds this diameter.
    cross_year_cluster_radius_m: 750   # [CHOICE] from the build spec. Verify
                                       # against the printed cluster-extent
                                       # diagnostic and sweep it: too large
                                       # fuses neighbouring flares, too small
                                       # splits one flare into several ids.

# ---------------------------------------------------------------------------
# CONTROL POINTS (the detector's negatives)
# Controls must share terrain, climate and land cover with the real sites.
# Negatives drawn from elsewhere would make the task trivially easy and the
# measured performance meaningless.
# ---------------------------------------------------------------------------
controls:
  per_site: 3                        # [CHOICE] 3:1 negative:positive ratio
  min_distance_m: 5000               # [CHOICE] far enough that a 20 m S2
                                     # pixel cannot catch the flare itself
  max_distance_m: 15000              # [CHOICE] close enough to share terrain
  min_distance_to_any_flare_m: 2000  # [CHOICE] from ANY flare, ANY YEAR --
                                     # a site that flared in 2015 and went
                                     # quiet is still not a clean negative
  require_onshore: true              # water is cold and dark in SWIR, so sea
                                     # controls are trivially separable and
                                     # would flatter the detector
  ee_chunk_size: 2000                # points per Earth Engine getInfo call

# ---------------------------------------------------------------------------
# EVALUATION (RULES 1, 2, 3)
# ---------------------------------------------------------------------------
evaluation:
  # RULE 1: never evaluate on training sites or years.
  holdouts:
    by_site: true
    by_year: true
    by_region: true               # required for the stretch goal. If the
                                  # model does not transfer across countries,
                                  # that is a reportable negative result.
  test_fraction: 0.2              # [CHOICE]
  cv_folds: 5                     # [CHOICE]
  held_out_years: [2023, 2024]    # [CHOICE] most recent = hardest and the
                                  # most realistic forward-monitoring test
  held_out_regions: [SAU]         # used only when region_holdout_mode: fixed

  # leave_one_out runs one fold per core region (hold out SAU, then IRQ,
  # then IRN) instead of a single fixed SAU fold. Three transfer tests
  # rather than one, and it separates geography from size: if a model
  # trained on small Saudi flares ALSO fails on large Iranian ones, the
  # failure is about size, not about crossing a border. It also stops the
  # whole transfer claim resting on the one fold whose very-large bin
  # contains a single site.
  region_holdout_mode: leave_one_out    # leave_one_out | fixed

  # -------------------------------------------------------------------
  # CONFOUND CONTROL (added 2026-08-31, from a measured problem)
  # Holding out SAU confounds REGION shift with SIZE shift. Measured on the
  # 2024 catalogue: Saudi flares average ~850 m3/h, Iranian ~7800 m3/h --
  # roughly 9x. So a performance drop on the SAU holdout has two competing
  # explanations (the model does not transfer geographically / the model is
  # worse on small flares) and the pooled number cannot separate them.
  # These settings force the separation instead of leaving it to judgement.
  # -------------------------------------------------------------------
  confound_control:
    enabled: true
    # Region-holdout metrics are reported PER SIZE BIN, never pooled alone.
    stratify_by_size: true
    # Build a size-matched training set: resample the training regions so
    # their size-bin proportions match the held-out region. Difference that
    # survives matching is geographic; difference that vanishes was size.
    size_matched_comparison: true
    matching_seed_key: split      # reuse seeds.split, never seeds.model
    # A per-bin metric on fewer sites than this is noise, not a result.
    min_sites_per_bin: 20
    # Kolmogorov-Smirnov statistic between train and test log-volume
    # distributions. Above this, a pooled region number is NOT reportable
    # on its own and must be accompanied by the matched comparison.
    max_acceptable_ks: 0.15

  # RULE 2: error must be reported as a function of flare size.
  # Bin edges in m3/h. The first two bins sit below the VIIRS detection
  # limit — that is the entire point of the project.
  size_bins_m3_per_h: [0, 100, 360, 1000, 5000, 20000, null]
  size_bin_labels: [tiny, sub-VIIRS, small, medium, large, very-large]

  # RULE 3: every headline number gets a bootstrap confidence interval.
  bootstrap:
    n_resamples: 10000
    ci_level: 0.95
    method: percentile

  metrics:
    detection: [precision, recall, f1, pr_auc, false_positive_rate]
    volume: [mae, rmse, mape, bias, r2, coverage_of_prediction_interval]

# ---------------------------------------------------------------------------
# MODELS (RULES 4, 5, 6)
# ---------------------------------------------------------------------------
models:
  dir: models

  # RULE 6: this runs FIRST. We must measure the failure before claiming to
  # fix it. Reproduce the standard published VIIRS volume calibration and
  # quantify its size-dependent bias (Elvidge et al. 2024, Energies: small
  # flares overestimated, large flares underestimated).
  baseline:
    name: viirs_power_law_calibration
    run_before_anything_else: true

  # RULE 5: simpler model first. Only escalate if it demonstrably wins.
  detection:
    primary: lightgbm
    escalate_to_cnn_only_if: GBT recall in the sub-VIIRS size bins is inadequate

  volume:
    primary: lightgbm
    # RULE 4: structurally incapable of predicting a negative volume.
    # log1p target with an expm1 inverse cannot produce a negative estimate.
    target_transform: log1p
    inverse_transform: expm1
    nonnegativity: structural     # NOT clipping. Clipping is a patch, and a
                                  # clipped negative prediction is still a
                                  # signal that the model is wrong.
    uncertainty:
      method: quantile_regression
      quantiles: [0.05, 0.5, 0.95]

  # Not built. Requires explicit justification against RULE 5.
  cnn:
    enabled: false

# ---------------------------------------------------------------------------
# EXPERIMENT LOGGING (RULE 8)
# ---------------------------------------------------------------------------
experiments:
  log_path: experiments/log.csv
  log_every_run: true
  fail_if_unlogged: true          # a result that was not logged did not happen

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
outputs:
  figures_dir: figures
  figure_dpi: 300
  figure_format: pdf              # vector, for print judging
  app_dir: app
  map_center: [26.0, 48.0]        # lat, lon — central Gulf
  map_zoom: 5
